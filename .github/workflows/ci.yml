name: CI va Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - name: Android loyihasini yaratish
        run: |
          npx cap add android
          npx cap sync android
      - name: APK yig'ish
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: APK nomini o'zgartirish
        run: cp android/app/build/outputs/apk/debug/app-debug.apk avtotest.apk
      - uses: actions/upload-artifact@v4
        with:
          name: avtotest-apk
          path: avtotest.apk
      - name: Telefondan yuklab olish uchun relizga qo'yish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Avtotest APK (oxirgi versiya)
          body: "main tarmog'idan avtomatik yig'ilgan debug APK. Telefonda yuklab olib o'rnating (noma'lum manbalardan o'rnatishga ruxsat bering)."
          prerelease: true
          make_latest: false
          files: avtotest.apk
